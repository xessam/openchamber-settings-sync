<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
    <title>OpenChamber Sync</title>
  </head>
  <body>
    <main id="root" aria-labelledby="title">
      <h1 id="title">OpenChamber Sync</h1>
      <p class="intro">Review which portable settings are available to sync.</p>
      <div id="action"></div>
      <p id="status" role="status" aria-live="polite">Nothing has been read yet.</p>
      <ul id="sources" aria-label="Sync sources"></ul>
      <p class="notice">This preview only reads local config. It does not upload or change anything.</p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
